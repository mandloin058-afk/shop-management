{% extends "base.html" %}
{% block content %}
<div class="card form-card"><div class="card-body">
  <h1 class="h5">Delete this record?</h1>
  <p class="text-muted">{{ object }} will be removed. Stock is adjusted automatically for sales and purchases.</p>
  <form method="post" class="d-flex gap-2">
    {% csrf_token %}
    <button class="btn btn-danger">Yes, delete</button>
    <a href="javascript:history.back()" class="btn btn-light">Cancel</a>
  </form>
</div></div>
{% endblock %}
