{% extends "base.html" %}
{% block content %}
<h1 class="h4 mb-3">{{ title }}</h1>
<div class="card form-card"><div class="card-body">
  <form method="post" novalidate>
    {% csrf_token %}
    {% for e in form.non_field_errors %}<div class="alert alert-danger">{{ e }}</div>{% endfor %}
    <div class="row g-3">
      {% for field in form %}
        <div class="col-md-6" id="row_{{ field.name }}">
          <label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>
          {{ field }}
          {% for e in field.errors %}<div class="text-danger small mt-1">{{ e }}</div>{% endfor %}
        </div>
      {% endfor %}
    </div>
    {% block after_form %}{% endblock %}
    <div class="mt-4 d-flex gap-2">
      <button class="btn btn-primary">Save</button>
      <a href="javascript:history.back()" class="btn btn-light">Cancel</a>
    </div>
  </form>
</div></div>
{% endblock %}
