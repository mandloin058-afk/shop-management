{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login - Shop Manager</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="{% static 'css/style.css' %}" rel="stylesheet">
</head>
<body class="login-page">
  <form method="post" class="card login-card p-4">
    {% csrf_token %}
    <h1 class="h4 mb-1">Shop Manager</h1>
    <p class="text-muted mb-4">Log in to manage your shop.</p>
    {% if form.errors %}<div class="alert alert-danger">Wrong username or password.</div>{% endif %}
    <label class="form-label" for="id_username">Username</label>
    <input type="text" name="username" id="id_username" class="form-control mb-3" autofocus required>
    <label class="form-label" for="id_password">Password</label>
    <input type="password" name="password" id="id_password" class="form-control mb-4" required>
    <input type="hidden" name="next" value="{{ next }}">
    <button class="btn btn-primary w-100">Log in</button>
  </form>
</body>
</html>
