{% extends "base.html" %}
{% block content %}
<div class="page-head">
  <h1 class="h4 m-0">Product-wise sales</h1>
  <form method="get" class="d-flex gap-2 flex-wrap">
    <input type="date" name="start" value="{{ start|date:'Y-m-d' }}" class="form-control">
    <input type="date" name="end" value="{{ end|date:'Y-m-d' }}" class="form-control">
    <button class="btn btn-primary">Show</button>
  </form>
</div>
<div class="card"><div class="table-responsive"><table class="table mb-0">
  <thead><tr><th>Product</th><th class="text-end">Quantity sold</th><th class="text-end">Revenue</th><th class="text-end">Profit</th></tr></thead>
  {% for r in rows %}
    <tr><td>{{ r.product__name }}</td><td class="text-end">{{ r.qty }}</td><td class="text-end">₹{{ r.revenue|floatformat:2 }}</td><td class="text-end">₹{{ r.profit|floatformat:2 }}</td></tr>
  {% empty %}<tr><td colspan="4" class="text-muted p-3">No sales in this period.</td></tr>{% endfor %}
</table></div></div>
{% endblock %}
